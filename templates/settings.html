{% extends "navbar.html" %}

{% block title %}Settings{% endblock %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/settings.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <form action="/settings" method="post" enctype="multipart/form-data">
        <input type="hidden" name="submit_action" value="upload_history">
        <input type="file"
            name="data_json_files"
            accept=".json,application/json"
            multiple
            required>
        <button type="submit">Send JSON files</button>
    </form>

    <form action="/settings" method="post" enctype="multipart/form-data">
        <input type="hidden" name="submit_action" value="fetch_spotify_data">
        <button type="submit">Fetch Spotify data</button>
    </form>
</div>
{% endblock %}
