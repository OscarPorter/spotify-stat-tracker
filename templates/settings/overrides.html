{% extends "navbar.html" %}

{% block title %}Settings{% endblock %}

{% block extra_css %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/settings.css') }}">
{% endblock %}

{% block content %}
<div class="container">
<div class="settings-layout">
    {% include "settings/settings_nav.html" %}

    <div class="settings-content">
        <h1>Overrides</h1>
        <div class="override-list">
            <form action="/settings/overrides" method="post">
                {{ override_options }}
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
