<!DOCTYPE html>
<html>

<head>
    <title>Spotify Stat Tracker!</title>
</head>

<body>
    <h2>Spotify Stat Tracker!</h2>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file"
            name="data_json_files"
            accept=".json,application/json"
            multiple
            required>
        <button type="submit">Send JSON files</button>
    </form>
</body>

</html>
