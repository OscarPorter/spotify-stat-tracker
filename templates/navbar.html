<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Spotify Stat Tracker{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/navbar.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <form action="{{ url_for('index') }}" class="home-form">
                <button class="site-name"><h2>Spotify Album Tracker</h2></button>
            </form>

            {% if not session.user_id %}
            <form action="{{ url_for('login') }}" method="get">
                <button class="green-button">Login</button>
            </form>
            {% endif %}

            {% if session.user_id %}
            <div class="dropdown">
                <button class="drop-trigger" type="button">
                    <img src="{{ session['profile_image'] }}" width="40" height="40">
                </button>
                
                
                <div class="dropdown-content">
                    <form action="{{ url_for('my_stats') }}" method="get">
                        <button class="dropdown-button" type="submit">My page</button>
                    </form>

                    <form action="{{ url_for('settings') }}" method="get">
                        <button class="dropdown-button" type="submit">Settings</button>
                    </form>

                    <hr>

                    <form action="{{ url_for('logout') }}" method="get">
                        <button class="dropdown-button" type="submit">Log out</button>
                    </form>
                </div>            
            </div>
           
            {% endif %}
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
